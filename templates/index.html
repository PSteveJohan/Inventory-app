<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Login</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        img#sourceImage {
            display: none;
        }

        /* iOS Liquid Glass Login Container */
        .login-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }

        .login-box {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
            width: 320px;
            transform: scale(0.95);
            opacity: 0;
            animation: iosPopup 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes iosPopup {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 26px;
            font-weight: 600;
            color: #ffffff;
            text-align: center;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .error {
            background-color: rgba(255, 59, 48, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 59, 48, 0.4);
            color: #ffdad6;
            font-size: 0.85rem;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 6px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            font-size: 1rem;
            color: #ffffff;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            outline: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.4);
        }

        button:hover {
            background: #0062cc;
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(0, 122, 255, 0.5);
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- WebGL Wallpaper and Liquid Glass Shader Elements -->
    <img
      id="sourceImage"
      crossorigin="anonymous"
      src="https://images.pexels.com/photos/268533/pexels-photo-268533.jpeg?cs=srgb&dl=pexels-pixabay-268533.jpg&fm=jpg"
    />
    <canvas id="canvas"></canvas>

    <!-- Fragment Shader Script adapted to lock onto the card layout -->
    <script id="fragShader" type="x-shader/x-fragment">
      precision mediump float;

      uniform vec3 iResolution;
      uniform float iTime;
      uniform vec2 uCardCenter;
      uniform vec2 uCardSize;
      uniform sampler2D iChannel0;

      void mainImage(out vec4 fragColor, in vec2 fragCoord)
      {
        vec2 uv = fragCoord / iResolution.xy;
        
        // Convert coordinates to match box area
        vec2 positionCenter = uCardCenter / iResolution.xy;
        vec2 sizeNormalized = uCardSize / iResolution.xy;
        
        vec2 m2 = (uv - positionCenter);
        // Scale check based on card bounding container proportions
        vec2 aspectCorr = vec2(iResolution.x / iResolution.y, 1.0);
        
        float roundedBox = pow(abs(m2.x * aspectCorr.x / (sizeNormalized.x * 0.6)), 6.0) + 
                           pow(abs(m2.y * aspectCorr.y / (sizeNormalized.y * 0.6)), 6.0);

        float rb1 = clamp((1.0 - roundedBox * 5.0) * 4.0, 0.0, 1.0);
        float rb2 = clamp((0.95 - roundedBox * 4.0) * 8.0, 0.0, 1.0) -
                    clamp(pow(0.9 - roundedBox * 4.0, 1.0) * 8.0, 0.0, 1.0);
        float rb3 = clamp((1.5 - roundedBox * 2.0) * 2.0, 0.0, 1.0) -
                    clamp(pow(1.0 - roundedBox * 2.0, 1.0) * 2.0, 0.0, 1.0);

        fragColor = vec4(0.0);
        float transition = smoothstep(0.0, 1.0, rb1 + rb2);

        if (transition > 0.0) {
          vec2 lens = ((uv - positionCenter) * (1.0 - roundedBox * 1500.0) + positionCenter);
          float total = 0.0;
          for (float x = -2.0; x <= 2.0; x++) {
            for (float y = -2.0; y <= 2.0; y++) {
              vec2 offset = vec2(x, y) * 0.5 / iResolution.xy;
              fragColor += texture2D(iChannel0, offset + lens);
              total += 1.0;
            }
          }
          fragColor /= total;

          float gradient = clamp((clamp(m2.y, 0.0, 0.2) + 0.1) / 2.0, 0.0, 1.0);
          vec4 lighting = clamp(fragColor + vec4(rb1) * gradient + vec4(rb2) * 0.3, 0.0, 1.0);

          fragColor = mix(texture2D(iChannel0, uv), lighting, transition);
        } else {
          fragColor = texture2D(iChannel0, uv);
        }
      }

      void main() {
        mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    </script>

    <!-- Login UI Container -->
    <div class="login-wrapper">
        <div class="login-box" id="loginBox">
            <h2>Inventory</h2>
            <div id="error-msg" class="error">Incorrect username or password</div>
            <form action="dashboard.html" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="off" placeholder="Enter username">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
                
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <!-- WebGL Renderer Script locked to the Login Box -->
    <script>
      const canvas = document.getElementById("canvas");
      const gl = canvas.getContext("webgl");
      const img = document.getElementById("sourceImage");
      const loginBox = document.getElementById("loginBox");

      const setCanvasSize = () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      };
      setCanvasSize();

      const vsSource = `
        attribute vec2 position;
        void main() {
          gl_Position = vec4(position, 0.0, 1.0);
        }
      `;

      const fsSource = document.getElementById("fragShader").textContent;

      const createShader = (type, source) => {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        return shader;
      };

      const vs = createShader(gl.VERTEX_SHADER, vsSource);
      const fs = createShader(gl.FRAGMENT_SHADER, fsSource);
      const program = gl.createProgram();

      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      gl.useProgram(program);

      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(
        gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
        gl.STATIC_DRAW
      );

      const position = gl.getAttribLocation(program, "position");
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

      const uniforms = {
        resolution: gl.getUniformLocation(program, "iResolution"),
        time: gl.getUniformLocation(program, "iTime"),
        cardCenter: gl.getUniformLocation(program, "uCardCenter"),
        cardSize: gl.getUniformLocation(program, "uCardSize"),
        texture: gl.getUniformLocation(program, "iChannel0"),
      };

      const texture = gl.createTexture();
      const setupTexture = () => {
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      };

      if (img.complete) {
        setupTexture();
      } else {
        img.onload = setupTexture;
      }

      const startTime = performance.now();
      const render = () => {
        const currentTime = (performance.now() - startTime) / 1000;

        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Dynamically track the login box position on screen for the shader lens effect
        const rect = loginBox.getBoundingClientRect();
        const cardCenterX = rect.left + rect.width / 2;
        const cardCenterY = canvas.height - (rect.top + rect.height / 2);

        gl.uniform3f(uniforms.resolution, canvas.width, canvas.height, 1.0);
        gl.uniform1f(uniforms.time, currentTime);
        gl.uniform2f(uniforms.cardCenter, cardCenterX, cardCenterY);
        gl.uniform2f(uniforms.cardSize, rect.width, rect.height);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.uniform1i(uniforms.texture, 0);

        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      };

      window.addEventListener("resize", setCanvasSize);
      render();

      // Show error message if redirected back with ?error=1
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === '1') {
          document.getElementById('error-msg').style.display = 'block';
      }
    </script>
</body>
</html>
